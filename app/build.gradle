plugins {
    id 'com.android.application'
}

android {
    namespace 'com.painel.flutuante'
    compileSdk 34

    defaultConfig {
        applicationId 'com.painel.flutuante'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
